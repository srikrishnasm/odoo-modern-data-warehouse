name: 'odoo_analytics'
version: '1.0.0'
config-version: 2

profile: 'odoo_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  odoo_analytics:
    staging:
      +materialized: table
    mart:
      +materialized: table
      +schema: MART
    analytics:
      +materialized: table
      +schema: ANALYTICS
